services:
  redis:
    image: redis:7-alpine
    container_name: graffiti-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - graffiti-net

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: graffiti-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-YourStrong@Passw0rd}"
      MSSQL_PID: "Developer"
    ports:
      - "${SQL_PORT:-1433}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD:-YourStrong@Passw0rd}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - graffiti-net

  migration-runner:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: graffiti-migrations
    restart: "no"
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-YourStrong@Passw0rd}"
      SQL_HOST: "sqlserver"
      SQL_USER: "sa"
    volumes:
      - ./Scripts:/scripts:ro
      - ./entrypoint-migrations.sh:/entrypoint-migrations.sh:ro
    command: ["bash", "-c", "sed -i 's/\r$$//' /entrypoint-migrations.sh && /bin/bash /entrypoint-migrations.sh"]
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - graffiti-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: graffiti-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-5217}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__SqlServerConnection: "Server=sqlserver,1433;Database=Graffiti;User Id=sa;Password=${MSSQL_SA_PASSWORD:-YourStrong@Passw0rd};TrustServerCertificate=True;"
      ConnectionStrings__Redis: "redis:6379"
      JwtSettings__Secret: "GlobalGraffitiWall_SuperSecretKey_ForSigningTokens_2026!#*CustomJwtKey789"
      JwtSettings__Issuer: "GlobalGraffitiWall"
      JwtSettings__Audience: "GlobalGraffitiWallClient"
      CanvasSettings__MaxCapacity: "16"
      CanvasSettings__RefillRatePerSecond: "0.2"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
      migration-runner:
        condition: service_completed_successfully
    networks:
      - graffiti-net

volumes:
  redis_data:
  mssql_data:

networks:
  graffiti-net:
    driver: bridge
